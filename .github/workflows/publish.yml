# Registry owner must configure the matching npm Trusted Publisher before tagging a release.
name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
        with:
          install-args: --frozen-lockfile
      - name: Build npm artifact
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp pack
      - name: Publish with npm Trusted Publishing
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Release tag must match package.json version' >&2
            exit 1
          fi
          npm publish --provenance --access public
