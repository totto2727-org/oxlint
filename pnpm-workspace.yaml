allowBuilds:
  msgpackr-extract: false

# Enforce pnpm's default 24-hour release age without automatically approving young versions.
minimumReleaseAgeStrict: true

# https://viteplus.dev/guide/local-cli#manual-installation
# Keep vp test and direct Vitest imports on the bundled runner.
overrides:
  'vitest@*': 5.0.3
